name: Authority contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  adversarial-contract:
    name: Three controls and eight rejections
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check out authority source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Run bounded adversarial contract
        run: timeout 30 bash tests/adversarial.sh
